<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills | Math Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: radial-gradient(circle at 10% 30%,#0b1c26,#07161f);
            font-family:'Inter',sans-serif;
            color:white;
            padding:30px 40px;
        }
        .container{max-width:1200px;margin:auto;}
        .header{
            display:flex;justify-content:space-between;align-items:center;
            background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);
            border-radius:60px;padding:12px 28px;margin-bottom:40px;
        }
        .logo h2{background:linear-gradient(145deg,#FFF6D9,#B5E4FF);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .home-btn{background:#1f6c7f;padding:8px 22px;border-radius:40px;text-decoration:none;color:white;font-weight:600;}
        h1{font-size:2.5rem;margin:30px 0 20px;border-left:6px solid cyan;padding-left:20px;}
        .skills-grid{
            display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px;
        }
        .skill-card{
            background:rgba(255,255,255,0.05);backdrop-filter:blur(12px);
            border-radius:35px;padding:25px;text-align:center;
        }
        .skill-icon{font-size:3rem;margin-bottom:15px;}
        .skill-name{font-size:1.5rem;margin:10px 0;}
        .progress-bar{background:#255a6e;border-radius:30px;height:12px;margin:15px 0;}
        .progress-fill{background:#1f6c7f;width:65%;height:12px;border-radius:30px;}
        footer{margin-top:50px;text-align:center;color:#8eacc0;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h2>📐 Math Academy</h2></div>
        <a href="home.html" class="home-btn">🏠 Home</a>
    </div>
    <h1><i class="fas fa-chart-line"></i> My Skills</h1>
    <div class="skills-grid">
        <div class="skill-card"><div class="skill-icon"><i class="fas fa-square-root-alt"></i></div><div class="skill-name">Algebra</div><div class="progress-bar"><div class="progress-fill" style="width:78%"></div></div><span>78% mastered</span></div>
        <div class="skill-card"><div class="skill-icon"><i class="fas fa-shapes"></i></div><div class="skill-name">Geometry</div><div class="progress-bar"><div class="progress-fill" style="width:55%"></div></div><span>55% advanced</span></div>
        <div class="skill-card"><div class="skill-icon"><i class="fas fa-chart-line"></i></div><div class="skill-name">Calculus</div><div class="progress-bar"><div class="progress-fill" style="width:42%"></div></div><span>42% intermediate</span></div>
        <div class="skill-card"><div class="skill-icon"><i class="fas fa-brain"></i></div><div class="skill-name">Problem Solving</div><div class="progress-bar"><div class="progress-fill" style="width:88%"></div></div><span>88% excellent</span></div>
    </div>
    <footer>🎯 Keep practicing to level up your skills</footer>
</div>
<script>if(!localStorage.getItem('currentUser')) window.location.href='index.html';</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lessons | Math Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:radial-gradient(circle at 10% 30%,#0b1c26,#07161f);font-family:'Inter',sans-serif;color:white;padding:30px 40px;}
        .container{max-width:1200px;margin:auto;}
        .header{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);border-radius:60px;padding:12px 28px;margin-bottom:40px;}
        .logo h2{background:linear-gradient(145deg,#FFF6D9,#B5E4FF);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .home-btn{background:#1f6c7f;padding:8px 22px;border-radius:40px;text-decoration:none;color:white;}
        h1{font-size:2.5rem;margin-bottom:30px;border-left:6px solid cyan;padding-left:20px;}
        .lessons-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
        .lesson-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(12px);border-radius:35px;padding:25px;transition:0.2s;}
        .lesson-card:hover{background:rgba(31,108,127,0.2);transform:translateY(-4px);}
        .lesson-icon{font-size:2.3rem;margin-bottom:10px;}
        footer{margin-top:50px;text-align:center;color:#8eacc0;}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><div class="logo"><h2>📐 Math Academy</h2></div><a href="home.html" class="home-btn">Home</a></div>
    <h1><i class="fas fa-book-open"></i> Interactive Lessons</h1>
    <div class="lessons-grid">
        <div class="lesson-card"><div class="lesson-icon"><i class="fas fa-square-root-alt"></i></div><h3>Algebra Basics</h3><p>Variables, expressions, equations</p><button onclick="alert('Start lesson')">Start →</button></div>
        <div class="lesson-card"><div class="lesson-icon"><i class="fas fa-chart-line"></i></div><h3>Functions & Graphs</h3><p>Linear & quadratic functions</p><button onclick="alert('Start lesson')">Start →</button></div>
        <div class="lesson-card"><div class="lesson-icon"><i class="fas fa-shapes"></i></div><h3>Geometry Proofs</h3><p>Triangles, circles, theorems</p><button onclick="alert('Start lesson')">Start →</button></div>
        <div class="lesson-card"><div class="lesson-icon"><i class="fas fa-chart-line"></i></div><h3>Calculus Intro</h3><p>Limits and derivatives</p><button onclick="alert('Start lesson')">Start →</button></div>
    </div>
    <footer>📚 New lessons added weekly</footer>
</div>
<script>if(!localStorage.getItem('currentUser')) window.location.href='index.html';</script>
</body>
</html>
</html>

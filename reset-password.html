<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0f1e27;font-family:'Inter';color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;}
        .reset-card{background:#1c2f3a;border-radius:50px;padding:40px;width:400px;text-align:center;}
        input,button{width:100%;padding:14px;margin:12px 0;border-radius:60px;border:none;}
        button{background:#1f6c7f;color:white;font-weight:bold;cursor:pointer;}
        .back{background:#e67e22;margin-top:0;}
    </style>
</head>
<body>
<div class="reset-card">
    <h2>🔐 Reset Password</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="newPass" placeholder="New password (min 8 chars)">
    <button onclick="resetPass()">Update Password</button>
    <button class="back" onclick="window.location.href='admin.html'">← Back to Admin</button>
    <div id="msg" style="margin-top:10px;"></div>
</div>
<script>
    function resetPass(){
        let users=JSON.parse(localStorage.getItem('users'))||[];
        let username=document.getElementById('username').value.trim();
        let newPass=document.getElementById('newPass').value.trim();
        let idx=users.findIndex(u=>u.username===username);
        if(idx===-1){document.getElementById('msg').innerText='User not found';return;}
        if(newPass.length<8){document.getElementById('msg').innerText='Min 8 characters';return;}
        users[idx].password=newPass;
        localStorage.setItem('users',JSON.stringify(users));
        document.getElementById('msg').innerText='✅ Password updated successfully';
    }
</script>
</body>
</html>

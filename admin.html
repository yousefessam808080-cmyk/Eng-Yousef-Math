<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Admin Panel</title><link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet"><style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
    body{background: #eef2f7;padding:40px 20px;}
    .admin-box{max-width:1000px;margin:0 auto;background:white;border-radius:48px;padding:40px;}
    .loginArea{max-width:400px;margin:auto;text-align:center;}
    input{padding:15px;border-radius:60px;border:1px solid #bcd;width:100%;margin:15px 0;}
    button{background:#1f6c7f;color:white;border:none;padding:12px 30px;border-radius:40px;font-weight:bold;}
    .card{background:#f8fcff;border-radius:30px;padding:20px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
    .approve{background:#27ae60;}.reject{background:#e74c3c;}
    .hidden{display:none;}
</style></head>
<body>
<div class="admin-box">
    <div id="loginBox"><div class="loginArea"><h2>🔐 Admin Login</h2><input id="adminPass" type="password"><button onclick="verify()">Enter</button><div id="err" style="color:red;margin-top:10px;"></div></div></div>
    <div id="dashBox" class="hidden"><div style="display:flex;justify-content:space-between;"><h2>🛡️ Pending users</h2><button onclick="logout()">Logout</button></div><div id="pendingList"></div><h3 style="margin-top:30px;">✅ Active users</h3><div id="activeList"></div></div>
</div>
<script>
    const PASS = "mido2500";
    function verify(){ let p=document.getElementById('adminPass').value; if(p===PASS){ document.getElementById('loginBox').classList.add('hidden'); document.getElementById('dashBox').classList.remove('hidden'); loadAll(); } else document.getElementById('err').innerText='wrong password'; }
    function loadAll(){ let users=JSON.parse(localStorage.getItem('users'))||[]; let pending=users.filter(u=>u.status==='pending'); let active=users.filter(u=>u.status==='approved'); let pendingDiv=document.getElementById('pendingList'); let activeDiv=document.getElementById('activeList'); pendingDiv.innerHTML=pending.map(u=>`<div class='card'><div><strong>${u.name}</strong><br>${u.username}<br>📅 ${u.createdAt}</div><div><button class='approve' onclick='change(${u.id},"approve")'>Approve</button> <button class='reject' onclick='change(${u.id},"reject")'>Reject</button></div></div>`).join(''); activeDiv.innerHTML=active.map(u=>`<div class='card'><div><strong>${u.name}</strong><br>${u.username}</div><div><span style='background:#e1ffe8;padding:5px 15px;border-radius:60px;'>✅ Active</span></div></div>`).join(''); if(!pending.length) pendingDiv.innerHTML='<p>✨ No requests</p>';
    }
    function change(id,act){ let users=JSON.parse(localStorage.getItem('users'))||[]; if(act==='approve') users=users.map(u=>u.id===id?{...u,status:'approved'}:u); else users=users.filter(u=>u.id!==id); localStorage.setItem('users',JSON.stringify(users)); loadAll();}
    function logout(){ document.getElementById('dashBox').classList.add('hidden'); document.getElementById('loginBox').classList.remove('hidden'); document.getElementById('adminPass').value='';}
</script>
</body>
</html>
